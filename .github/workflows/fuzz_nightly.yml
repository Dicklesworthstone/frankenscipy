name: Fuzz (nightly ASan)

# Scheduled nightly fuzz run for fsci-special oracle-roundtrip and
# related complex-branch harnesses, under AddressSanitizer via cargo-fuzz's
# own -Zsanitizer=address. br-n3au. The original config asked for
# `-Zsanitizer=address,undefined`, which the pinned toolchain REJECTS at
# compile time (`undefined` is not a rustc sanitizer value at all — see the
# accepted list in any `-Z help`), so every nightly failed while BUILDING the
# first target and never fuzzed anything. UBSan is not available through
# -Zsanitizer on this toolchain; ASan + libFuzzer's own checks are what runs.

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC nightly
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "crates/fsci-special/**"
      - "fuzz/fuzz_targets/p2c006_special_*.rs"
      - "fuzz/corpus/p2c006_special_*/**"
      - "fuzz/Cargo.toml"
      - ".github/workflows/fuzz_nightly.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  special-nightly:
    name: "fuzz special (900s/target)"
    runs-on: ubuntu-latest
    # PR runs are short; scheduled runs get the full 900s/target budget.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets with ASan (900s each)
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          # The ASan link of the fsci-special chain OOM-killed the hosted
          # runner's ld on 2026-09-04 (10 silent minutes, then death with no
          # diagnostics; libFuzzer never started). Both ld flags trade peak
          # RSS for link speed.
          RUSTFLAGS: "-Clink-arg=-Wl,--no-keep-memory -Clink-arg=-Wl,--reduce-memory-overheads"
        run: |
          set -e
          for t in p2c006_special_airy_complex \
                   p2c006_special_bessel_base_complex \
                   p2c006_special_bessel_derivatives \
                   p2c006_special_complex_branches \
                   p2c006_special_elliptic_complex \
                   p2c006_special_hankel_complex \
                   p2c006_special_hyper_complex \
                   p2c006_special_incomplete_gamma_beta \
                   p2c006_special_oracle_roundtrip; do
            echo "=== fuzz $t (900s, ASan) ==="
            timeout 920 cargo fuzz run "$t" -- -max_total_time=900 || \
              { echo "$t failed"; exit 1; }
          done
        timeout-minutes: 180

  special-pr-gate:
    name: "fuzz special (60s/target, PR lane)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets with ASan (60s each)
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          RUSTFLAGS: "-Clink-arg=-Wl,--no-keep-memory -Clink-arg=-Wl,--reduce-memory-overheads"
        run: |
          set -e
          for t in p2c006_special_complex_branches \
                   p2c006_special_oracle_roundtrip; do
            echo "=== fuzz $t (60s, ASan, PR lane) ==="
            timeout 80 cargo fuzz run "$t" -- -max_total_time=60 || \
              { echo "$t failed"; exit 1; }
          done
        timeout-minutes: 15
