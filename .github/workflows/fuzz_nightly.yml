name: Fuzz (nightly ASan)

# Scheduled nightly fuzz run under AddressSanitizer via cargo-fuzz's
# `-Zsanitizer=address` (br-n3au, frankenscipy-3cu8u.7).
#
# Architecture:
# 1. `special-and-audit-nightly`: runs the 9 `p2c006_special_*` targets plus
#    `p2c002_linalg_rcond_flood` and `audit_symmetry` for 900s each under ASan.
# 2. `rotation-nightly`: deterministically partitions all 98 targets in
#    `fuzz/Cargo.toml` into 7 slices (`day_of_year % 7`, 14 targets/night) so
#    every target in `fuzz/fuzz_targets/` is fuzzed at least weekly within the
#    hosted-runner time budget.
# 3. Both nightly jobs invoke `fuzz_triage` (`if: always()`) on `fuzz/artifacts`
#    and upload crash/triage artifacts when any findings are present.

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC nightly
  workflow_dispatch:
    inputs:
      rotation_slice:
        description: "Optional 0..6 slice override (defaults to UTC day-of-year % 7)"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz_nightly.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  special-nightly:
    name: "fuzz special + rcond_flood + audit_symmetry (900s/target)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Pre-build pinned fuzz targets with ASan (not time-bounded)
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          RUSTFLAGS: "-Clink-arg=-Wl,--no-keep-memory"
        run: |
          set -e
          for t in p2c006_special_airy_complex \
                   p2c006_special_bessel_base_complex \
                   p2c006_special_bessel_derivatives \
                   p2c006_special_complex_branches \
                   p2c006_special_elliptic_complex \
                   p2c006_special_hankel_complex \
                   p2c006_special_hyper_complex \
                   p2c006_special_incomplete_gamma_beta \
                   p2c006_special_oracle_roundtrip \
                   p2c002_linalg_rcond_flood \
                   audit_symmetry; do
            cargo fuzz build "$t"
          done
      - name: Run pinned fuzz targets with ASan (900s each)
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          RUSTFLAGS: "-Clink-arg=-Wl,--no-keep-memory"
        run: |
          set -e
          FAILED=0
          for t in p2c006_special_airy_complex \
                   p2c006_special_bessel_base_complex \
                   p2c006_special_bessel_derivatives \
                   p2c006_special_complex_branches \
                   p2c006_special_elliptic_complex \
                   p2c006_special_hankel_complex \
                   p2c006_special_hyper_complex \
                   p2c006_special_incomplete_gamma_beta \
                   p2c006_special_oracle_roundtrip \
                   p2c002_linalg_rcond_flood \
                   audit_symmetry; do
            echo "=== fuzz $t (900s, ASan) ==="
            timeout 1000 cargo fuzz run "$t" -- -max_total_time=900 || {
              echo "$t failed"
              FAILED=1
            }
          done
          exit "$FAILED"
      - name: Triage crash artifacts with fuzz_triage
        if: always()
        run: |
          cargo run -p fsci-conformance --bin fuzz_triage -- --no-file-beads
      - name: Upload crash and triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-special-nightly-artifacts
          if-no-files-found: ignore
          path: |
            fuzz/artifacts/**
            crates/fsci-conformance/fixtures/adversarial/triage/**
            crates/fsci-conformance/fixtures/regressions/fuzz/**

  rotation-nightly:
    name: "fuzz 7-day full rotation (all 98 targets)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Select deterministic 1/7th target slice
        id: slice
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.rotation_slice }}" ]; then
            SLICE=$(( ${{ github.event.inputs.rotation_slice }} % 7 ))
          else
            DOY=$(date -u +%-j)
            SLICE=$(( DOY % 7 ))
          fi
          mapfile -t ALL_TARGETS < <(awk -F'"' '/^\[\[bin\]\]/{getline; print $2}' fuzz/Cargo.toml | sort)
          TOTAL=${#ALL_TARGETS[@]}
          SELECTED=()
          for (( i=0; i<TOTAL; i++ )); do
            if (( i % 7 == SLICE )); then
              SELECTED+=("${ALL_TARGETS[$i]}")
            fi
          done
          echo "Selected slice $SLICE / 7 (${#SELECTED[@]} of $TOTAL targets): ${SELECTED[*]}"
          echo "targets=${SELECTED[*]}" >> "$GITHUB_OUTPUT"
          echo "slice=$SLICE" >> "$GITHUB_OUTPUT"
      - name: Pre-build slice fuzz targets with ASan
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          RUSTFLAGS: "-Clink-arg=-Wl,--no-keep-memory"
        run: |
          set -e
          for t in ${{ steps.slice.outputs.targets }}; do
            cargo fuzz build "$t"
          done
      - name: Run slice fuzz targets with ASan (600s each)
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          RUSTFLAGS: "-Clink-arg=-Wl,--no-keep-memory"
        run: |
          set -e
          FAILED=0
          for t in ${{ steps.slice.outputs.targets }}; do
            echo "=== fuzz $t (600s, ASan, slice ${{ steps.slice.outputs.slice }}) ==="
            timeout 680 cargo fuzz run "$t" -- -max_total_time=600 || {
              echo "$t failed"
              FAILED=1
            }
          done
          exit "$FAILED"
      - name: Triage crash artifacts with fuzz_triage
        if: always()
        run: |
          cargo run -p fsci-conformance --bin fuzz_triage -- --no-file-beads
      - name: Upload crash and triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-rotation-slice-${{ steps.slice.outputs.slice }}-artifacts
          if-no-files-found: ignore
          path: |
            fuzz/artifacts/**
            crates/fsci-conformance/fixtures/adversarial/triage/**
            crates/fsci-conformance/fixtures/regressions/fuzz/**

  special-pr-gate:
    name: "fuzz special + audit_symmetry (60s/target, PR lane)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets with ASan (60s each)
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          RUSTFLAGS: "-Clink-arg=-Wl,--no-keep-memory"
        run: |
          set -e
          for t in p2c006_special_complex_branches \
                   p2c006_special_oracle_roundtrip \
                   p2c002_linalg_rcond_flood \
                   audit_symmetry; do
            echo "=== fuzz $t (60s, ASan, PR lane) ==="
            timeout 80 cargo fuzz run "$t" -- -max_total_time=60 || \
              { echo "$t failed"; exit 1; }
          done
      - name: Triage crash artifacts with fuzz_triage
        if: failure()
        run: |
          cargo run -p fsci-conformance --bin fuzz_triage -- --no-file-beads
