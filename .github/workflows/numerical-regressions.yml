name: Numerical regression tests

on:
  push:
    branches: [main]
    paths:
      - "crates/fsci-opt/**"
      - "crates/fsci-integrate/**"
      - "crates/fsci-interpolate/**"
      - "crates/fsci-spatial/**"
      - "crates/fsci-linalg/**"
      - "crates/fsci-sparse/**"
      - "crates/fsci-stats/**"
      - "crates/fsci-ndimage/**"
      - "crates/fsci-special/**"
      - "crates/fsci-signal/**"
      - "crates/fsci-conformance/tests/diff_signal_sosfilt.rs"
      - "crates/fsci-conformance/tests/diff_signal_resample.rs"
      - "crates/fsci-conformance/tests/diff_signal_stft_istft.rs"
      - "crates/fsci-conformance/src/lib.rs"
      - "crates/fsci-conformance/python_oracle/scipy_fft_oracle.py"
      - "crates/fsci-conformance/tests/diff_stats_truncnorm.rs"
      - "crates/fsci-conformance/tests/diff_integrate.rs"
      - "crates/fsci-conformance/tests/diff_integrate_solve_ivp_dense_events.rs"
      - "crates/fsci-conformance/tests/diff_integrate_monte_carlo_qmc_quad.rs"
      - "crates/fsci-conformance/tests/diff_linalg_matrix_functions.rs"
      - "crates/fsci-conformance/tests/diff_opt_curve_fit.rs"
      - "crates/fsci-conformance/tests/diff_opt_nnls_isotonic_lsa.rs"
      - "crates/fsci-conformance/tests/diff_opt_lm_root.rs"
      - ".github/workflows/numerical-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings
  FSCI_REQUIRE_SCIPY_ORACLE: "1"
  SCIPY_PYTHON: python
  FSCI_PYTHON: python

jobs:
  numerical-regressions:
    name: "Numerical regressions (${{ matrix.lane }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [least-squares, global-optimization, sparse-lsmr, distribution-fit, matrix-functions, image-rotation, resampling, fft-capture, casp, quadrature, boundary-value, interpolation, signal-state]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: numerical-regressions
          cache-on-failure: true
          workspaces: ". -> target-isolated"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and verify the numerical oracle
        run: |
          python -m pip install "scipy==1.17.1" "numpy==2.4.3"
          python - <<'PY'
          import scipy, numpy
          assert scipy.__version__ == "1.17.1", scipy.__version__
          assert numpy.__version__ == "2.4.3", numpy.__version__
          PY
      - name: Run numerical regression tests
        env:
          LANE: ${{ matrix.lane }}
        run: |
          case "$LANE" in
            least-squares)
              cargo test --locked -p fsci-opt --lib isotonic_regression -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_opt_nnls_isotonic_lsa -- --nocapture
              cargo test --locked -p fsci-opt --lib fsolve -- --nocapture
              cargo test --locked -p fsci-opt --lib lm_root -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_opt_lm_root -- --nocapture
              cargo test --locked -p fsci-opt --lib curvefit::tests -- --nocapture
              cargo test --locked -p fsci-opt --lib trf::tests -- --nocapture
              cargo test --locked -p fsci-opt --test weighted_curve_fit -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_opt_curve_fit -- --nocapture
              cargo test --locked -p fsci-opt --lib trf_lsmr::tests -- --nocapture
              cargo test --locked -p fsci-opt --lib newton_krylov -- --nocapture
              cargo test --locked -p fsci-opt --lib nk_gmres -- --nocapture
              cargo test --locked -p fsci-opt --test least_squares_lsmr_scipy -- --nocapture
              cargo test --locked -p fsci-opt --test linear_least_squares_scipy -- --nocapture
              ;;
            global-optimization)
              cargo test --locked -p fsci-opt --lib milp -- --nocapture
              cargo test --locked -p fsci-opt --lib shgo -- --nocapture
              cargo test --locked -p fsci-opt --test milp_scipy -- --nocapture
              cargo test --locked -p fsci-opt --test shgo_scipy -- --nocapture
              ;;
            sparse-lsmr)
              cargo test --locked -p fsci-sparse --no-default-features --lib gmres_ -- --nocapture
              cargo test --locked -p fsci-sparse --no-default-features --lib cg_ -- --nocapture
              cargo test --locked -p fsci-sparse --no-default-features --test cg_preconditioned_scipy -- --nocapture
              cargo test --locked -p fsci-sparse --no-default-features --lib lsmr -- --nocapture
              cargo test --locked -p fsci-sparse --no-default-features --lib lsqr -- --nocapture
              cargo test --locked -p fsci-sparse --no-default-features --test lsmr_options_scipy -- --nocapture
              ;;
            quadrature)
              cargo test --locked -p fsci-integrate --lib qmc_ -- --nocapture
              cargo test --locked -p fsci-integrate --test qmc_scipy -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_integrate_monte_carlo_qmc_quad -- --nocapture
              cargo test --locked -p fsci-integrate --lib quad::tests -- --nocapture
              cargo test --locked -p fsci-integrate --test differential_integrate quad_vec_scaled_scipy -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_integrate_cubature_scalar -- --nocapture
              cargo test --locked -p fsci-integrate --test nquad_scipy -- --nocapture
              cargo test --locked -p fsci-integrate --test differential_integrate de_quadrature_scipy -- --nocapture
              cargo test --locked -p fsci-integrate --test differential_integrate sampled_simpson -- --nocapture
              cargo test --locked -p fsci-integrate --test differential_integrate gauss_kronrod_global_error_matches_live_scipy -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_integrate diff_integrate_tanhsinh -- --nocapture
              ;;
            boundary-value)
              cargo test --locked -p fsci-integrate --lib solve_ivp_event_refinement -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_integrate_solve_ivp_dense_events -- --nocapture
              cargo test --locked -p fsci-integrate --lib bvp -- --nocapture
              cargo test --locked -p fsci-integrate --lib collocation::tests -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_integrate_solve_bvp_collocation -- --nocapture
              ;;
            interpolation)
              cargo test --locked -p fsci-interpolate --test linear_nd -- --nocapture
              cargo test --locked -p fsci-interpolate --test linear_nd_scipy -- --nocapture
              ;;
            casp)
              cargo test --locked -p fsci-integrate --lib casp -- --nocapture
              cargo test --locked -p fsci-opt --lib casp -- --nocapture
              cargo test --locked -p fsci-linalg --lib default_fast_solve_ -- --test-threads=1
              cargo test --locked -p fsci-linalg --lib portfolio_solve_repairs_ -- --test-threads=1
              cargo test --locked -p fsci-linalg --lib solve_certificate_verification_rejects_overflowed_residuals_and_magnitudes -- --test-threads=1
              cargo test --locked -p fsci-linalg --test differential_linalg default_fast_solve_matches_live_scipy -- --nocapture
              ;;
            distribution-fit)
              cargo test --locked -p fsci-stats --lib normal_fit_tests -- --nocapture
              cargo test --locked -p fsci-stats --test mode_scipy -- --nocapture
              cargo test --locked -p fsci-stats --lib student_t -- --nocapture
              cargo test --locked -p fsci-stats --lib fit_only_stats_distributions_expose_typed_try_fit -- --nocapture
              cargo test --locked -p fsci-stats --lib doublegamma_ -- --nocapture
              cargo test --locked -p fsci-stats --lib gennorm_fit -- --nocapture
              cargo test --locked -p fsci-stats --lib gen_gamma_fit -- --nocapture
              cargo test --locked -p fsci-stats --lib generalized_exponential_fit_is_at_least_as_good_as_scipy -- --nocapture
              cargo test --locked -p fsci-stats --lib noncentral_f_fit_is_at_least_as_good_as_scipy -- --nocapture
              cargo test --locked -p fsci-stats --lib try_fit_folded_normal -- --nocapture
              cargo test --locked -p fsci-stats --lib try_fit_laplace_asymmetric -- --nocapture
              cargo test --locked -p fsci-stats --lib test_fit_cauchy -- --nocapture
              cargo test --locked -p fsci-stats --lib expnorm_fit -- --nocapture
              cargo test --locked -p fsci-stats --lib discrete_likelihood_fits -- --nocapture
              cargo test --locked -p fsci-stats --lib randint_fitted_extreme_signed_intervals -- --nocapture
              cargo test --locked -p fsci-stats --test mle_scipy -- --nocapture
              ;;
            matrix-functions)
              cargo test --locked -p fsci-linalg --lib complex::tests -- --nocapture
              cargo test --locked -p fsci-linalg --lib matrix_functions_ -- --nocapture
              cargo test --locked -p fsci-linalg --lib logm -- --nocapture
              cargo test --locked -p fsci-linalg --lib sqrtm -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_linalg_matrix_functions -- --nocapture
              ;;
            image-rotation)
              cargo test --locked -p fsci-ndimage --lib fourier_ -- --nocapture
              cargo test --locked -p fsci-ndimage --bin diff_fourier -- --nocapture
              cargo test --locked -p fsci-special --lib degree_trig_preserves_scipy_cosine_rounding -- --nocapture
              cargo test --locked -p fsci-ndimage --lib rotate_ -- --nocapture
              cargo test --locked -p fsci-ndimage --test rotate_axes_scipy -- --nocapture
              ;;
            resampling)
              cargo test --locked -p fsci-stats --test permutation_scipy -- --nocapture
              ;;
            signal-state)
              cargo test --locked -p fsci-signal --lib frequency_response -- --nocapture
              cargo test --locked -p fsci-signal --lib dbode -- --nocapture
              cargo test --locked -p fsci-signal --lib decimate -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_signal_resample -- --nocapture
              cargo test --locked -p fsci-signal --lib short_time::tests -- --nocapture
              cargo test --locked -p fsci-signal --lib test_stft -- --nocapture
              cargo test --locked -p fsci-signal --doc stft_with_options -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_signal_stft_istft -- --nocapture
              cargo test --locked -p fsci-signal --test place_poles_scipy -- --nocapture
              cargo test --locked -p fsci-signal --lib sosfilt_ -- --nocapture
              cargo test --locked -p fsci-signal --doc SosFilter -- --nocapture
              cargo test --locked -p fsci-conformance --no-default-features --test diff_signal_sosfilt -- --nocapture
              ;;
            fft-capture)
              cargo test --locked -p fsci-conformance --no-default-features --lib fft -- --nocapture
              ;;
            *)
              echo "Unknown regression lane: $LANE" >&2
              exit 1
              ;;
          esac
