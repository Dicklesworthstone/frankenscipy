name: CI Gates (G1-G9)

# HISTORY THIS FILE HAS TO ANSWER FOR. Measured 2026-09-03 (frankenscipy-yhuux / liel6):
# the previous revision of this workflow ran 7,914 times and succeeded ZERO times. G1 failed
# on rustfmt drift in ~30 s, so every gate below it was skipped for the life of the project,
# and the gates themselves could not have passed anyway: G2 ran `cargo test --workspace`
# (610K source lines, 10,057 unit tests) under a 5-minute timeout with no build cache; G3 ran
# 2 of the 731 `diff_*` conformance files; nothing installed SciPy for the 660 test files that
# resolve a live SciPy interpreter, so under the default env they SKIPPED and passed; G6
# compared `docs/` baselines against `docs/` (themselves).
#
# Rules of this file:
#   * No gate is weakened to land a change. A vacuous step is deleted, not kept for the tick.
#   * Every job restores the same dependency cache (one shared key) so the wall is parallel.
#   * The live-SciPy lanes REQUIRE the oracle (FSCI_REQUIRE_SCIPY_ORACLE=1) against the pinned
#     incumbent recorded in fsci_runtime::scipy_incumbent (scipy 1.17.1 + numpy 2.4.3). A
#     missing or wrong interpreter is a failure, never a skip; the `g3-oracle-required-control`
#     job proves that by running one lane without SciPy and asserting it FAILS.

# TRIGGER SHAPE. The shared tree auto-commits and pushes every few minutes, and this account's
# hosted-runner queue was already 5-7 hours deep with the old one-job workflow. So a PUSH runs
# only G1 (one job, fmt + clippy) and the newest push cancels the ones still waiting; the full
# evidence run (per-crate tests, the 14 live-SciPy shards, e2e, perf, evidence packs) runs on
# the nightly schedule and on demand via workflow_dispatch, where a 40-job fan-out is affordable
# and nothing races it. Bead syncs and doc-only pushes do not trigger a run at all.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".beads/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # 05:23 UTC nightly: the full gate fan-out
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `-D warnings` is the standing policy. It REPLACES the `.cargo/config.toml` rustflags
  # (`-Z threads=4 -C target-feature=+avx2,+fma`); the AVX2 build is bit-identical to the
  # baseline build, so correctness gates lose nothing by running on the x86-64 baseline.
  RUSTFLAGS: -D warnings
  # `.cargo/config.toml` points the target dir at `target-isolated` for the shared dev tree.
  # The cache action only saves `target`, so pin the dir back here.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Pinned live-SciPy incumbent. Must match fsci_runtime::scipy_incumbent::{PINNED_SCIPY,
  # PINNED_NUMPY}; the resolver prints both versions and `genuine=` on every harness start.
  PINNED_SCIPY: "1.17.1"
  PINNED_NUMPY: "2.4.3"

jobs:
  # ── G1: Formatting + Linting ──────────────────────────────────────
  g1-lint:
    name: "G1: fmt + clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ── G2: Unit + Property Tests, one job per crate ─────────────────
  # A failure names its crate, the wall is parallel, and the conformance crate's 796
  # integration-test binaries are NOT built here (they are the G3 lanes below).
  g2-unit-tests:
    name: "G2: unit + property tests (${{ matrix.crate }})"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        crate:
          - fsci-arrayapi
          - fsci-cluster
          - fsci-constants
          - fsci-datasets
          - fsci-fft
          - fsci-integrate
          - fsci-interpolate
          - fsci-io
          - fsci-linalg
          - fsci-ndimage
          - fsci-odr
          - fsci-opt
          - fsci-runtime
          - fsci-signal
          - fsci-sparse
          - fsci-spatial
          - fsci-special
          - fsci-stats
        include:
          - crate: fsci-conformance
            args: --lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - run: cargo test -p ${{ matrix.crate }} ${{ matrix.args }} -- --nocapture

  # ── G3: Differential conformance against the LIVE, PINNED SciPy ──
  # 731 `diff_*` files, sharded by family. Each file is its own test binary, so the loop
  # builds and runs them one at a time against the shared dependency cache. Every shard
  # runs with the oracle REQUIRED: a test that cannot reach SciPy fails instead of skipping.
  g3-diff-live-scipy:
    name: "G3: live-SciPy diff (${{ matrix.shard }})"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: stats-a-c,     glob: "diff_stats_[a-c]*" }
          - { shard: stats-d-k,     glob: "diff_stats_[d-k]*" }
          - { shard: stats-l-p,     glob: "diff_stats_[l-p]*" }
          - { shard: stats-q-z,     glob: "diff_stats_[q-z]*" }
          - { shard: special-a-h,   glob: "diff_special_[a-h]*" }
          - { shard: special-i-z,   glob: "diff_special_[i-z]*" }
          - { shard: signal,        glob: "diff_signal_*" }
          - { shard: sparse,        glob: "diff_sparse_*" }
          - { shard: optimize,      glob: "diff_opt*" }
          - { shard: linalg,        glob: "diff_linalg_*" }
          - { shard: ndimage,       glob: "diff_ndimage_*" }
          - { shard: fft-integrate, glob: "diff_@(fft|integrate)*" }
          - { shard: spatial-interp-cluster, glob: "diff_@(spatial|interpolate|cluster)*" }
          - { shard: runtime-misc,  glob: "diff_@(runtime|constants|arrayapi|odr)*" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install the pinned SciPy incumbent
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scipy==${PINNED_SCIPY}" "numpy==${PINNED_NUMPY}"
          python - <<'EOF'
          import numpy, scipy, os, sys
          print("scipy", scipy.__version__, "numpy", numpy.__version__, sys.executable)
          assert scipy.__version__ == os.environ["PINNED_SCIPY"], scipy.__version__
          assert numpy.__version__ == os.environ["PINNED_NUMPY"], numpy.__version__
          EOF
          echo "SCIPY_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "FSCI_REQUIRE_SCIPY_ORACLE=1" >> "$GITHUB_ENV"
      - name: Run the shard (oracle required)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob extglob
          files=(crates/fsci-conformance/tests/${{ matrix.glob }}.rs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "shard glob '${{ matrix.glob }}' matched no files" >&2
            exit 1
          fi
          echo "shard ${{ matrix.shard }}: ${#files[@]} test binaries"
          failed=()
          for f in "${files[@]}"; do
            t="$(basename "$f" .rs)"
            echo "=== $t ==="
            if ! cargo test -p fsci-conformance --test "$t" -- --nocapture; then
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "FAILED (${#failed[@]}/${#files[@]}): ${failed[*]}" >&2
            exit 1
          fi

  # ── G3 control: the oracle-required lane must FAIL without SciPy ──
  # Two-arm proof for the gate itself. Runs one diff binary with FSCI_REQUIRE_SCIPY_ORACLE=1
  # and SCIPY_PYTHON pointed at an interpreter that cannot import SciPy; the job passes only
  # if that test FAILS. If this job ever goes green the wrong way, a missing oracle has
  # started to skip-and-pass again and every green shard above is meaningless.
  g3-oracle-required-control:
    name: "G3 control: no SciPy must fail"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prove the interpreter has no SciPy, then require it
        shell: bash
        run: |
          set -uo pipefail
          if python -c "import scipy" 2>/dev/null; then
            echo "control interpreter unexpectedly imports scipy" >&2
            exit 1
          fi
          export SCIPY_PYTHON="$(which python)"
          export FSCI_REQUIRE_SCIPY_ORACLE=1
          if cargo test -p fsci-conformance --test diff_stats_aic_bic -- --nocapture; then
            echo "GATE DEFECT: the oracle-required lane PASSED with no SciPy present" >&2
            exit 1
          fi
          echo "control ok: the lane failed closed without SciPy"

  # ── G3b: Live SciPy Oracle Capture (pinned) ───────────────────────
  g3-live-scipy-oracle:
    name: "G3b: live SciPy oracle capture"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install the pinned SciPy incumbent
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scipy==${PINNED_SCIPY}" "numpy==${PINNED_NUMPY}"
      - name: Capture live SciPy oracle report
        run: |
          cargo run -p fsci-conformance --bin live_oracle_capture -- \
            --python "$(which python)" \
            --output target/live-oracle-capture.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-oracle-capture
          path: |
            target/live-oracle-capture.json
            target/live-oracle-capture.json.raptorq.json
            target/live-oracle-capture.json.decode_proof.json
          if-no-files-found: error

  # ── G3c: the rest of the conformance crate ────────────────────────
  # Golden journeys, metamorphic suites, schema, RaptorQ proofs, smoke, and the fallback
  # (no-SciPy) capture mode of live_oracle_capture. These do not need the oracle.
  g3-conformance-other:
    name: "G3c: goldens + metamorphic + fallback capture"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=()
          for f in crates/fsci-conformance/tests/{golden,metamorphic,oracle,live,fuzz}_*.rs; do
            t="$(basename "$f" .rs)"
            echo "=== $t ==="
            cargo test -p fsci-conformance --test "$t" -- --nocapture || failed+=("$t")
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "FAILED: ${failed[*]}" >&2
            exit 1
          fi
      - run: |
          cargo run -p fsci-conformance --bin live_oracle_capture -- \
            --allow-missing-oracle \
            --output target/live-oracle-capture-fallback.json

  # ── G4: Adversarial/Smoke Test ─────────────────────────────────────
  g4-adversarial:
    name: "G4: adversarial smoke"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - run: cargo test -p fsci-conformance --test smoke -- --nocapture

  # ── G5: E2E Scenario Orchestration ────────────────────────────────
  g5-e2e:
    name: "G5: E2E scenarios"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=()
          for f in crates/fsci-conformance/tests/e2e_*.rs; do
            t="$(basename "$f" .rs)"
            echo "=== $t ==="
            cargo test -p fsci-conformance --test "$t" -- --nocapture || failed+=("$t")
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "FAILED: ${failed[*]}" >&2
            exit 1
          fi

  # ── G6: Performance smoke + baseline artifact validation ──────────
  # The perf_* tests are real. The previous `benchmark_gate --compare docs` step compared the
  # published baselines against THEMSELVES and could not fail; it is gone. A true regression
  # compare needs a criterion run on a stable, dedicated host and is tracked separately.
  g6-perf:
    name: "G6: perf smoke + baseline validation"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=()
          for f in crates/fsci-conformance/tests/perf_*.rs; do
            t="$(basename "$f" .rs)"
            echo "=== $t ==="
            cargo test -p fsci-conformance --test "$t" -- --nocapture || failed+=("$t")
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "FAILED: ${failed[*]}" >&2
            exit 1
          fi
      - name: Validate published baseline schema and RaptorQ sidecars
        run: |
          cargo run -p fsci-conformance --bin benchmark_gate -- \
            --baselines-dir docs \
            --check-spec
          cargo run -p fsci-conformance --bin raptorq_sidecar -- --verify \
            docs/baseline_linalg.json \
            docs/baseline_sparse.json \
            docs/baseline_opt.json \
            docs/baseline_integrate.json \
            docs/baseline_fft.json

  # ── G7: Artifact Schema Validation + every evidence pack ──────────
  g7-schema:
    name: "G7: schema + evidence packs"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - run: cargo test -p fsci-conformance --test schema_validation -- --nocapture
      - shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=()
          for f in crates/fsci-conformance/tests/evidence_*.rs; do
            t="$(basename "$f" .rs)"
            echo "=== $t ==="
            cargo test -p fsci-conformance --test "$t" -- --nocapture || failed+=("$t")
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "FAILED: ${failed[*]}" >&2
            exit 1
          fi

  # ── G8: RaptorQ Decode-Proof Verification ─────────────────────────
  g8-raptorq:
    name: "G8: RaptorQ proofs"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          cache-on-failure: true
      - run: cargo test -p fsci-conformance --test raptorq_proofs -- --nocapture

  # ── G9: Tolerance Policy Ratchet ──────────────────────────────────
  # Lints fixture cases against artifacts/TOLERANCE_POLICY.md §2 baseline tiers. The
  # threshold MUST monotonically decrease, never rise; 361 is the 2026-05-03 audit datum.
  # Known limit (frankenscipy-liel6): this scans FSCI-P2C-*.json fixtures only, not the
  # tolerances written in the diff_*.rs files themselves.
  g9-tolerance-lint:
    name: "G9: tolerance-policy ratchet"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-release
          cache-on-failure: true
      - run: |
          cargo run --release -p fsci-conformance --bin tolerance_lint -- \
            --max-violations 361
