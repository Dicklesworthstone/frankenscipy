[toolchain]
# PINNED to `nightly-2026-08-31` (commit 5306413c6, 2026-09-04; originally pinned on
# 2026-07-25 under frankenscipy-q9nxz instead of floating `channel = "nightly"`).
#
# WHY: a floating nightly channel can promote new clippy lints or rustfmt changes that fail
# already-committed code under `-D warnings`, turning a toolchain bump into a fleet-wide G1
# failure. Pinning `nightly-2026-08-31` keeps G1 (`cargo fmt --all -- --check` and
# `cargo clippy --workspace --all-targets -- -D warnings`) deterministic across hosts and CI.
#
# Bumping the pin is a deliberate, separately-gated act: raise it only together with a full
# workspace lint and rustfmt sweep (`frankenscipy-so4d3`), never as a drive-by.
channel = "nightly-2026-08-31"
components = ["rustfmt", "clippy"]
