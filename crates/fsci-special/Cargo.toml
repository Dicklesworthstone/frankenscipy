[package]
name = "fsci-special"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
ndtri-isafloor-bench = ["dep:sha2"]


[lints]
workspace = true

[dependencies]
fsci-integrate = { workspace = true }
fsci-linalg = { workspace = true }
fsci-runtime = { workspace = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
criterion = { workspace = true }
sha2 = "0.10.9"

[[bench]]
name = "special_bench"
harness = false

# `autobins = false` (2ad35641e, "exclude ignored scratch bin targets") turned off bin
# auto-discovery for this crate. That was right in intent — `src/bin/` holds 120 `.rs` files
# and 119 of them are untracked scratch — but it also excluded the ONE that is tracked and
# intended, so `perf_cdf` became unbuildable: `cargo build --bin perf_cdf` answers "no bin
# target named `perf_cdf`". It is the harness `frankenscipy-2b7tr` depends on, added in
# 750a02308 and disabled three days later by a one-line change aimed at something else.
#
# Registering it explicitly restores exactly that one target and leaves the 119 scratch files
# excluded, which is what the original commit wanted. `required-features` keeps it out of a
# default build, so a plain `cargo build` still does not compile it.
[[bin]]
name = "perf_cdf"
path = "src/bin/perf_cdf.rs"
required-features = ["ndtri-isafloor-bench"]

# The live-SciPy harness. Registered for the same reason `perf_cdf` is — `autobins = false`
# would otherwise hide it among the untracked scratch — but WITHOUT `required-features`,
# matching the five other `perf_*_vs_scipy` harnesses in this workspace. Gating a benchmark
# behind a feature flag is how `perf_cdf` silently became unbuildable, and a harness that
# needs a flag to exist is a harness that gets measured with a stale binary.
[[bin]]
name = "perf_special_vs_scipy"
path = "src/bin/perf_special_vs_scipy.rs"
