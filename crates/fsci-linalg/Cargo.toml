[package]
name = "fsci-linalg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linear algebra decompositions, solvers, and eigenvalues for FrankenSciPy"

[lints]
workspace = true

[features]
chol-wall-bench = []
# Perf-only: pulls in `sha2` so `perf_eigh_vs_scipy` can self-report the SHA-256 of
# its own ELF from inside the process. Off by default — the library never uses sha2.
eigh-incumbent-bench = ["dep:sha2", "fsci-runtime/bench-harness"]
# Perf/infra-only: `probe_build_freshness` compares the source rustc compiled into it
# against the source on disk, to catch a stale remote binary (frankenscipy-eibro).
freshness-probe = ["dep:sha2"]
bench-harness = ["fsci-runtime/bench-harness", "eigh-incumbent-bench"]

[dependencies]
fsci-fft = { workspace = true }
fsci-runtime = { workspace = true }
nalgebra = "0.35"
rayon = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "linalg_bench"
harness = false

[[bin]]
name = "diff_uncovered_linalg_scipy"
required-features = ["bench-harness"]

[[bin]]
name = "perf_chol_vs_scipy"
required-features = ["bench-harness"]

[[bin]]
name = "perf_syrk_partition_vs_blas"
required-features = ["bench-harness"]
