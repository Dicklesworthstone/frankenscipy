[package]
name = "fsci-integrate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Numerical integration and ODE/IVP solvers for FrankenSciPy"

[lints]
workspace = true

[features]
# Perf-only: pulls in `sha2` so `perf_bdf_diag_newton` can self-report the SHA-256 of
# the ELF that produced its numbers (§2.1 of the campaign bench-harness contract).
# Off by default — the library itself never depends on sha2.
bdf-diag-bench = ["dep:sha2"]
# Perf-only: live SciPy incumbent harness with in-process ELF/source identity.
dblquad-incumbent-bench = ["dep:sha2"]
# Perf-only: screened live-SciPy `quad_many` whole-job harness.
quad-incumbent-bench = ["dep:sha2"]
# Perf-only: screened live-SciPy `tplquad_many` whole-job harness.
tplquad-incumbent-bench = ["dep:sha2"]

[dependencies]
fsci-opt = { workspace = true }
fsci-runtime = { workspace = true }
nalgebra = "0.35"
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "integrate_bench"
harness = false
