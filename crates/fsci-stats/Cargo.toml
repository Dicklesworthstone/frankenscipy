[package]
name = "fsci-stats"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Perf-only provenance support for live-incumbent harnesses. Off by default so
# the library itself does not acquire a production hashing dependency.
stats-incumbent-bench = ["dep:sha2"]

[dependencies]
fsci-runtime = { workspace = true }
fsci-special = { workspace = true }
fsci-opt = { workspace = true }
fsci-integrate = { workspace = true }
fsci-fft = { workspace = true }
rand = { workspace = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
sha2 = "0.10.9"

[[bench]]
name = "stats_bench"
harness = false

[lints]
workspace = true
