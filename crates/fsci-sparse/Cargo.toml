[package]
name = "fsci-sparse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sparse matrices and iterative solvers for FrankenSciPy"

[lints]
workspace = true

[features]
# Compatibility feature names retained for existing measurement invocations.
# The executable identity has to be available to every live-incumbent bin, so
# the hash implementation is a normal dependency of this benchmark crate.
sparse-incumbent-bench = []
live-scipy-bench = []
# The .npz archive codec (`io`: load_npz / save_npz). On by default for direct
# users. Workspace members that never touch .npz (fsci-integrate) leave it off,
# so they do not resolve or build npyz and zip and their pest and zlib-rs
# chains. The workspace dependency is default-features = false for that reason.
default = ["npz"]
npz = ["dep:npyz", "dep:zip"]

[dependencies]
fsci-linalg = { workspace = true }
fsci-runtime = { workspace = true }
nalgebra = { version = "0.35", features = ["sparse"] }
npyz = { workspace = true, optional = true }
rayon = "1.12.0"
sha2 = "0.10.9"
thiserror = { workspace = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "sparse_bench"
harness = false

[[bin]]
# Keep the campaign's canonical SPLU invocation live.  The implementation is
# shared with the explicitly named balanced-square harness below.
name = "perf_splu"
path = "src/bin/perf_splu_balanced_square.rs"
