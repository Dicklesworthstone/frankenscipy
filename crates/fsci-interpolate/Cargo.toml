[package]
name = "fsci-interpolate"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Interpolation and spline routines for FrankenSciPy"

[dependencies]
fsci-fft = { workspace = true }
fsci-linalg = { workspace = true }
fsci-runtime = { workspace = true }
fsci-spatial = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
sha2 = "0.10.9"

[features]
bench-harness = ["fsci-runtime/bench-harness"]

[[bench]]
name = "interpolate_bench"
harness = false

[[bin]]
name = "perf_griddata_live"
required-features = ["bench-harness"]

[[bin]]
name = "perf_interpolate_vs_scipy"
required-features = ["bench-harness"]

[lints]
workspace = true
