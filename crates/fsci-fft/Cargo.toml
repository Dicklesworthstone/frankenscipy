[package]
name = "fsci-fft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast Fourier Transform routines for FrankenSciPy"

[lints]
workspace = true

[dependencies]
fsci-runtime = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[features]
bench-harness = ["fsci-runtime/bench-harness"]

[[bench]]
name = "fft_bench"
harness = false

[[bin]]
name = "perf_fft_vs_scipy"
required-features = ["bench-harness"]
