[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
  "crates/fsci-cluster",
  "crates/fsci-constants",
  "crates/fsci-integrate",
  "crates/fsci-interpolate",
  "crates/fsci-io",
  "crates/fsci-linalg",
  "crates/fsci-ndimage",
  "crates/fsci-opt",
  "crates/fsci-sparse",
  "crates/fsci-fft",
  "crates/fsci-signal",
  "crates/fsci-spatial",
  "crates/fsci-special",
  "crates/fsci-stats",
  "crates/fsci-arrayapi",
  "crates/fsci-conformance",
  "crates/fsci-runtime",
  "crates/fsci-datasets",
  "crates/fsci-odr",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
fsci-arrayapi = { path = "crates/fsci-arrayapi" }
fsci-cluster = { path = "crates/fsci-cluster" }
fsci-conformance = { path = "crates/fsci-conformance" }
fsci-constants = { path = "crates/fsci-constants" }
fsci-datasets = { path = "crates/fsci-datasets" }
fsci-fft = { path = "crates/fsci-fft" }
fsci-integrate = { path = "crates/fsci-integrate" }
fsci-interpolate = { path = "crates/fsci-interpolate" }
fsci-io = { path = "crates/fsci-io" }
fsci-linalg = { path = "crates/fsci-linalg" }
fsci-ndimage = { path = "crates/fsci-ndimage" }
fsci-odr = { path = "crates/fsci-odr" }
fsci-opt = { path = "crates/fsci-opt" }
fsci-runtime = { path = "crates/fsci-runtime" }
fsci-sparse = { path = "crates/fsci-sparse" }
fsci-signal = { path = "crates/fsci-signal" }
fsci-spatial = { path = "crates/fsci-spatial" }
fsci-special = { path = "crates/fsci-special" }
fsci-stats = { path = "crates/fsci-stats" }
asupersync = { version = "0.3.9", default-features = false, features = ["test-internals"] }
ftui = { version = "0.3.1", default-features = false }
blake3 = "1.8.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2.0.18"
proptest = "1.11.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
toml = "1.1.2"
npyz = "0.9.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# ══════════════════════════════════════════════════════════════════════════════
# Profiling profiles
# ══════════════════════════════════════════════════════════════════════════════

[profile.release-perf]
inherits = "release"
debug = true                # Symbols for flamegraph
strip = false               # Keep symbols (base release sets strip=true) — profilers need them
lto = "thin"                # Better perf, faster builds than fat LTO
codegen-units = 1           # Consistent codegen for comparison

# Line tables ONLY, and nothing else touched. Use this — not `release-perf` — when
# the question is "which CALL SITE inside an optimized function costs this", and the
# answer has to transfer back to the binary the timed rows were taken on.
#
# WHY IT EXISTS (frankenscipy-xup61). A callgrind profile of the shipping `release`
# binary reports `???:` for every frame, because `release` carries symbols but no
# debug info, so `callgrind_annotate` can attribute cost to a FUNCTION but never to a
# line within it. That was the exact wall on splitting `factorize_csr`'s memcpy
# (22.06% of the factorization at side=16) into its copy-back and its in-merge run
# copies — one number that decides whether an in-place back-merge is worth building.
#
# WHY NOT `release-perf`. That profile also sets `lto = "thin"` and
# `codegen-units = 1` against `release`'s defaults (`lto` off, 16 units). Those change
# INLINING, so the call sites inside `factorize_csr` are not the same call sites, and
# a share measured there does not transfer to the shipping binary. `debug = 1` adds
# line tables without touching a single optimization decision, so this profile's
# codegen is `release`'s codegen — the ELF SHA-256 differs (more sections) while the
# instruction stream does not, which is the property the attribution needs.
#
# It is NOT a timing profile: the extra debug sections cost nothing at run time, but
# any row taken here must still name its own ELF SHA-256, which will not match the
# `release` one.
[profile.release-lines]
inherits = "release"
debug = 1                   # Line tables for per-call-site attribution
strip = false               # callgrind_annotate needs them present
