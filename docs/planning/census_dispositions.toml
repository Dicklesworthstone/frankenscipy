# SciPy names the census (scripts/symbol_census.py, frankenscipy-8dndw.2) must not count by name
# match alone. Every entry is checked against the tree on each run, and a stale one fails it:
#   na           not applicable to a Rust library; leaves the denominator, never counts as real
#   missing      not implemented; must match no Rust item (implement it, then drop the entry)
#   wrong_alias  a Rust item matches the name but computes something else; not real
#   adapted      implemented under another Rust name; `rust` names it (fsci_crate::Item[::Member])
# A name with no entry is real exactly when a public Rust item matches it.

[[entry]]
module = "scipy.constants"
name = "ConstantWarning"
disposition = "na"
reason = "no obsolete CODATA keys to warn about"
bead = "frankenscipy-8dndw.1"

[[entry]]
module = "scipy.sparse"
name = "SparseWarning"
disposition = "na"
reason = "no operation SciPy warns on (CSR/CSC element insertion, format-converting solver inputs)"
